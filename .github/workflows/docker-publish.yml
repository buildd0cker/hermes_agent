name: Build and publish Docker image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      hermes_version:
        description: 'Hermes version tag (e.g., v2026.9.7). Leave empty for latest.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 获取实际使用的版本号（用于镜像标签）
      - name: Resolve version
        id: resolve_version
        run: |
          if [ -n "${{ github.event.inputs.hermes_version }}" ]; then
            # 用户指定了版本
            echo "tag=${{ github.event.inputs.hermes_version }}" >> $GITHUB_OUTPUT
          else
            # 自动获取最新版本
            LATEST=$(curl -s https://api.github.com/repos/NousResearch/hermes-agent/releases/latest | grep tag_name | cut -d '"' -f 4)
            echo "tag=${LATEST}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            # 始终打 latest 标签
            ghcr.io/${{ github.repository }}:latest
            # 版本标签
            ghcr.io/${{ github.repository }}:${{ steps.resolve_version.outputs.tag }}
          build-args: |
            HERMES_VERSION=${{ github.event.inputs.hermes_version }}

      # 输出构建信息
      - name: Print build info
        run: |
          echo "✅ Docker image built and pushed!"
          echo "📦 Latest: ghcr.io/${{ github.repository }}:latest"
          echo "📦 Version: ghcr.io/${{ github.repository }}:${{ steps.resolve_version.outputs.tag }}"