name: Test Hermes Download

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Hermes version to test (e.g., v2026.9.7)'
        required: false
        default: 'v2026.9.7'

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Test standard curl download (with retry)
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Testing standard GitHub download for version: $VERSION"
          # 增加详细输出和重试次数
          curl -v -L --retry 5 --retry-delay 5 --connect-timeout 30 \
            "https://github.com/NousResearch/hermes-agent/archive/refs/tags/${VERSION}.tar.gz" \
            -o /tmp/test1.tar.gz
          echo "Curl exit code: $?"
          ls -la /tmp/test1.tar.gz || echo "File not found"
          file /tmp/test1.tar.gz || echo "file command failed"

      - name: Test codeload fallback
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Testing codeload fallback for version: $VERSION"
          curl -v -L --retry 5 --retry-delay 5 --connect-timeout 30 \
            "https://codeload.github.com/NousResearch/hermes-agent/tar.gz/refs/tags/${VERSION}" \
            -o /tmp/test2.tar.gz
          echo "Curl exit code: $?"
          ls -la /tmp/test2.tar.gz || echo "File not found"
          file /tmp/test2.tar.gz || echo "file command failed"

      - name: Check if tag exists
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Checking if tag '$VERSION' exists on GitHub..."
          git ls-remote --tags https://github.com/NousResearch/hermes-agent.git | grep -E "refs/tags/${VERSION}$" || echo "Tag not found"

      - name: Test git clone as fallback
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Attempting shallow clone for tag: $VERSION"
          git clone --depth 1 --branch ${VERSION} https://github.com/NousResearch/hermes-agent.git /tmp/hermes-test
          echo "Clone successful. Contents:"
          ls -la /tmp/hermes-test/
